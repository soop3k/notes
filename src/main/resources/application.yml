spring:
  application.name: zip-importer
  datasource:
    url: jdbc:h2:file:./data/imports;AUTO_SERVER=TRUE
    username: sa
    password: ""
importer:
  mode: local
  run-on-startup: false
  zone: Europe/Warsaw
  jobs:
    customers:
      enabled: true
      path: ./sample/customers-{date}.zip
      schema-entry: schema.json
      csv-entry: data.csv
      delimiter: ","
      batch-size: 500
      record-type: customer
      headers:
        customerId: customer_id
        fullName: customer_name
    orders:
      enabled: false
      path: ./sample/orders-{date}.zip
      record-type: order
      headers:
        orderNumber: order_no
        amount: gross_amount
        currency: currency_code
  sftp:
    host: localhost
    port: 22
    username: importer
    known-hosts: ${user.home}/.ssh/known_hosts
    allow-unknown-host: false
